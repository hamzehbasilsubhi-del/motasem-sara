<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدعوة تحت الصيانة</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;1,400&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #fcfbf7;
            font-family: 'Amiri', 'Aref Ruqaa', serif;
            text-align: center;
            color: #333;
        }
        .maintenance-container {
            padding: 40px 20px;
            border: 1px solid #d4af37;
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 2.2rem;
            color: #d4af37;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.5rem;
            color: #555;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <h1>الدعوة تحت الصيانة</h1>
        <p>معتصم & سارة</p>
    </div>

</body>
</html>
