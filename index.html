<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف معتصم & سارة</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;1,400&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- عنصر الموسيقى في الخلفية -->
    <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

    <!-- شاشة الغلاف والتفاعل الأولى -->
    <div id="interactive-cover">
        <video id="envelope-video" src="video.mp4" playsinline muted preload="auto" class="video-behind-cover"></video>
        <img id="cover-image" src="cover.png" alt="غلاف الدعوة">
        <button id="open-btn" aria-label="فتح الدعوة"></button>
    </div>

    <!-- محتوى الدعوة الرئيسي -->
    <main id="wedding-invitation" class="hidden">
        
        <!-- البانر الرئيسي -->
        <header class="hero-section">
            <video class="hero-video" src="hero-bg.mp4" autoplay loop muted playsinline preload="auto"></video>
            <div class="hero-overlay"></div>
            
            <div class="hero-content">
                <div class="couples-names-img-wrapper">
                    <img src="couples-names.png" alt="معتصم وسارة" class="couples-names-img">
                </div>
                <p class="wedding-date-highlight">17 . 10 . 2026</p>
                
                <div class="hero-logo-wrapper">
                    <img src="logo.png" alt="شعار الزفاف" class="wedding-logo">
                </div>
            </div>
        </header>

        <!-- قسم صورة الخلفية text-bg.jpg بمقاس 9:16 كاملة -->
        <section class="invitation-text-container">
            <img src="text-bg.jpg" alt="خلفية النص" class="text-bg-full-img">
        </section>

        <!-- قسم الإطار المدمج مع تقويم Save The Date -->
        <section class="frame-image-container">
            <img src="frame-bg.jpg" alt="خلفية الإطار المزين" class="frame-bg-img">
            <img src="calendar-overlay.png" alt="تقويم موعد الزفاف Save The Date" class="calendar-overlay-img">
        </section>

        <!-- قسم العد التنازلي -->
        <section class="section countdown-section">
            <div class="countdown-content-wrapper">
                <h2 class="countdown-title-cursive">Our Forever Begins In</h2>
                
                <div id="countdown-display">
                    <div class="digits-row">
                        <span id="days">00</span>
                        <span class="colon">:</span>
                        <span id="hours">00</span>
                        <span class="colon">:</span>
                        <span id="minutes">00</span>
                        <span class="colon">:</span>
                        <span id="seconds">00</span>
                    </div>
                    <div class="labels-row">
                        <label>DAYS</label>
                        <label>HOURS</label>
                        <label>MINUTES</label>
                        <label>SECONDS</label>
                    </div>
                </div>
            </div>
        </section>

        <!-- قسم صورة برنامج الحفل program-bg.jpg بدون نصوص أو أيقونات فوقها -->
        <section class="program-overlay-container">
            <img src="program-bg.jpg" alt="برنامج الحفل" class="program-bg-img">
        </section>

        <!-- قسم صورة المغلف والبطاقة المرجعية -->
        <section class="envelope-quote-container">
            <img src="envelope-quote-bg.jpg" alt="بطاقة ورسالة الزفاف" class="envelope-quote-img">
        </section>

        <!-- موقع الحفل المدمج مع الخلفية الجديدة venue-bg.jpg -->
        <section class="location-section-bg">
            <div class="location-content-block">
                <h3>موقع الحفل</h3>
                <p class="venue-name">Grand Plaza Movenpick City</p>
                
                <div class="venue-image-wrapper">
                    <img src="venue-building.png" alt="Grand Plaza Movenpick" class="venue-building-img">
                </div>

                <div class="elegant-map-frame">
                    <div class="map-inner-border">
                        <div class="map-container">
                            <iframe 
                                src="https://maps.google.com/maps?q=Grand%20Plaza%20Movenpick%20City&t=&z=15&ie=UTF8&iwloc=&output=embed" 
                                width="100%" height="260" style="border:0;" allowfullscreen="" loading="eager">
                            </iframe>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- قسم تأكيد الحضور المطور -->
        <section class="custom-rsvp-section">
            <h2 class="rsvp-header-title">Rsvp</h2>

            <div class="custom-rsvp-card">
                <!-- صورة الأسماء المرجعية -->
                <div class="custom-couple-names-wrapper">
                    <img src="rsvp-couple-names.png" alt="معتصم وسارة" class="custom-couple-names-img">
                </div>

                <!-- نموذج الإدخال -->
                <form id="rsvp-custom-form" class="custom-form-body">
                    <!-- حقل الاسم -->
                    <div class="form-group">
                        <label class="input-label">*الاسم</label>
                        <input type="text" class="custom-input" required>
                    </div>

                    <!-- التكرم بتأكيد الحضور -->
                    <div class="form-group">
                        <label class="input-label">*التكرم بتأكيد الحضور</label>
                        <div class="custom-radio-group">
                            <label class="radio-btn-option">
                                <input type="radio" name="attendance" value="yes" checked>
                                <span class="radio-box">نعم</span>
                            </label>
                            <label class="radio-btn-option">
                                <input type="radio" name="attendance" value="no">
                                <span class="radio-box">لا</span>
                            </label>
                        </div>
                    </div>

                    <!-- كلمة من قلبك لهم -->
                    <div class="form-group">
                        <label class="input-label">*كلمة من قلبك لهم</label>
                        <textarea class="custom-textarea" rows="3" required></textarea>
                    </div>

                    <!-- زر الإرسال -->
                    <button type="submit" class="custom-submit-btn">إرسال</button>
                </form>
            </div>

            <p class="rsvp-bottom-phrase">وبحضوركم تتم الفرحة والسرور</p>
        </section>

        <!-- التذييل السفلي -->
        <footer class="matching-footer">
            <p class="footer-heart-text">♡ ودامت دياركم بالخير ♡</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
